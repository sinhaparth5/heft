name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and test (static, Alpine)
        run: >
          docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g)
          -v "$PWD":/src -w /src alpine:3.23 sh scripts/build-static.sh
