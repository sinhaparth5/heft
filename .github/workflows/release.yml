# Push a tag vYYYY.MM.PATCH (matching project(VERSION) in CMakeLists.txt) to publish a
# release with static Linux binaries for x86_64 and aarch64.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match the CMake version
        run: |
          ver=$(sed -n 's/^project(pkgtop VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$ver" = "$TAG" ] || { echo "::error::tag $TAG but CMakeLists.txt says $ver"; exit 1; }
      - name: Notes from CHANGELOG
        run: |
          awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' \
            CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no '## [${TAG#v}]' section in CHANGELOG.md"; exit 1; }
      - name: Create draft release
        run: gh release create "$TAG" --draft --verify-tag --title "pkgtop ${TAG#v}" --notes-file notes.md

  build:
    needs: draft
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and test (static, Alpine)
        run: >
          docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g)
          -v "$PWD":/src -w /src alpine:3.23 sh scripts/build-static.sh
      - name: Upload to the draft
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: gh release edit "$TAG" --draft=false
